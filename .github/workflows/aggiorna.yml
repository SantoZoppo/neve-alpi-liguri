name: Aggiorna previsioni

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: aggiorna-previsioni
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica le previsioni
        run: node scripts/aggiorna.mjs
      - name: Salva i dati nel repository
        run: |
          git config user.name "aggiorna-previsioni"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meteo.json
          if git diff --cached --quiet; then echo "Nessuna novità"; exit 0; fi
          git commit -m "Previsioni aggiornate"
          git pull --rebase
          git push
